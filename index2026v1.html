<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <title>TReAD夏季冬季日夜風場</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <link href="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.css" rel="stylesheet" />
  <script src="https://api.mapbox.com/mapbox-gl-js/v3.14.0/mapbox-gl.js"></script>
  <style>
    html,body,#map{height:100%;margin:0}
    /* 設定面板（預設隱藏） */
    .panel{position:absolute;top:58px;left:12px;z-index:10;background:rgba(255,255,255,.96);
      padding:12px 14px;border-radius:14px;box-shadow:0 10px 28px rgba(0,0,0,.18);
      font:14px/1.5 system-ui,"Noto Sans TC"; display:none; max-width:400px}
    .row{display:grid;grid-template-columns:110px 1fr 56px;gap:10px;align-items:center;margin:6px 0}
    .row label{white-space:nowrap}
    .row select{grid-column:2/span 2}
    .title{font-weight:700;margin-bottom:4px}
    .inline{display:flex;gap:10px;margin-bottom:6px}
    .status{position:absolute;bottom:25px;left:12px;background:rgba(0,0,0,.7);color:#fff;
      padding:6px 10px;border-radius:8px;font-size:12px}

    /* 左上：設定按鈕 */
    .settings-btn{position:absolute;top:12px;left:12px;z-index:11;border:none;border-radius:12px;
      padding:8px 12px;background:#1f2937;color:#fff;cursor:pointer;box-shadow:0 6px 16px rgba(0,0,0,.2)}
    .settings-btn:hover{background:#111827}

    /* 右下：飛行視角 */
    .flybar{position:absolute;right:12px;bottom:25px;z-index:10;display:flex;gap:8px}
    .flybar button{border:none;border-radius:12px;padding:10px 12px;background:#2563eb;color:#fff;cursor:pointer;
      box-shadow:0 6px 16px rgba(0,0,0,.2)}
    .flybar button:hover{background:#1e40af}
    /* 右側地形 legend（預設隱藏） */
    /* 右側地形 legend（預設隱藏）— 最多不超過視窗高度的 1/3 */
/* 右側地形 legend（預設隱藏）— 最多不超過視窗高度 1/3 */
  .legend{
    position:absolute; right:12px; top:12px; z-index:12;
    background:rgba(255,255,255,.96); padding:6px; border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    box-sizing:border-box;
    max-height:33svh;    /* Safari/行動裝置更準的視窗高度單位 */
    overflow:auto;       /* 即使內容過大也不會「突出」，容器內滾動 */
  }

  /* 右側地形 legend（預設隱藏）— 容器高度以視窗為基準 */
  #terrainLegend.legend,
  #aermodTerrainLegend.legend{
    position:absolute; right:12px; top:12px; z-index:12;
    background:rgba(255,255,255,.96); padding:6px; border-radius:10px;
    box-shadow:0 8px 20px rgba(0,0,0,.15);
    box-sizing:border-box;
    height: clamp(120px, 33svh, 360px);  /* ← 明確高度；不超過視窗高 1/3，且有上下限 */
    overflow:hidden;                     /* 超出就裁掉（或改 overflow:auto 顯示卷軸） */
  }

  /* 讓圖片吃容器高度，等比縮放；強制覆蓋任何 inline 寫死尺寸 */
  #terrainLegend img,
  #aermodTerrainLegend img{
    display:block;
    height:100% !important;   /* ← 關鍵：跟著容器高度走 */
    width:auto !important;    /* 等比縮放，不拉寬 */
    max-width:min(40vw, 88svw);
    object-fit:contain;
  }

  /* 平板/手機再縮小一點容器高度與外距 */
  @media (max-width: 768px){
    #terrainLegend.legend,
    #aermodTerrainLegend.legend{ right:8px; top:8px; height: clamp(100px, 28svh, 300px); }
    #terrainLegend img,
    #aermodTerrainLegend img{ max-width: min(60vw, 90svw); }
  }
  @media (max-width: 420px){
    #terrainLegend.legend,
    #aermodTerrainLegend.legend{ height: clamp(90px, 24svh, 240px); }
    #terrainLegend img,
    #aermodTerrainLegend img{ max-width: min(70vw, 92svw); }
  }



    /* 右側風場色階 legend */
    .wind-legend{
      position:absolute; right:12px; bottom:88px; z-index:12;
      background:rgba(255,255,255,.96); padding:10px 10px 8px; border-radius:10px;
      box-shadow:0 8px 20px rgba(0,0,0,.15); width:270px
    }
    .wind-legend .hdr{display:flex;justify-content:space-between;align-items:center;font-weight:500;font-size: 12px;margin-bottom:6px}
    .wind-legend canvas{display:block;width:250px;height:16px;border-radius:3px}
    .wind-legend .ticks{display:flex;justify-content:space-between;margin-top:4px;font-size:12px;opacity:.85}
    /* 特定區選單 */
    .flybar select{

    }
    .mini-btn:hover{ background:#d1d5db; }
    .wind-canvas{
      position:absolute;
      inset:0;
      z-index:4;
      pointer-events:none;
    }


  </style>

<!-- 設定面板（點上面的按鈕才展開） -->

  <div class="row">

  <div class="title" style="margin-top:6px">模式地形</div>

    </div>
    <div class="row">

    </div>

  </div>
  <div class="inline">
    <label><input id="chkArrows" type="checkbox"> 顯示風向箭頭(放大到某程度才會出現)</label>

  <div class="inline">

</div>

<!-- 右下：飛行視角 -->
<div class="flybar">

<div id="terrainLegend" class="legend" style="display:none;">

<script>
  // 1) 公開 token
  mapboxgl.accessToken = 'pk.eyJ1IjoidGVkbGl1IiwiYSI6ImNtMHAxMjdveDAwZWUya29sanY1c3Btc2EifQ.dGpYV4RZ4-OcpITjSKfcfg';

  // 2) 你的 3D 地形樣式
  const STYLE_URL = 'mapbox://styles/tedliu/cm0qicaza00mf01pwfsfj3qgx';

  // 3) 四個 tileset
  const TILESETS = {
    DJF_day:   'mapbox://tedliu.tw_wind_djf_day',
    DJF_night: 'mapbox://tedliu.tw_wind_djf_night',
    JJA_day:   'mapbox://tedliu.tw_wind_jja_day',
    JJA_night: 'mapbox://tedliu.tw_wind_jja_night'
  };
  const SOURCE_LAYER = 'twinds';
  const BAND_NAME    = 'wind';
  const PIN_SOURCE_ID = 'user-pins';
  const PIN_POINT_LAYER_ID = 'user-pins-point';
  const PIN_LABEL_LAYER_ID = 'user-pins-label';
  const PIN_FILE_URL = 'pins.json';
  const WIND_NATIVE = {};
  let windProbePopup = null;
  let windCanvas = null;
  let windCtx = null;
  let windCanvasWidth = 0;
  let windCanvasHeight = 0;
  let windDpr = 1;
  let windAnimFrame = 0;
  let windLastFrameTs = 0;
  let windParticles = [];
  let windReferenceAreaKm2 = null;
  let windReferenceZoom = null;
  let windActualTargetCount = 0;
  const PIN_DATA = {
    type: 'FeatureCollection',
    features: []
  };



  // === 自訂 TEAL 色帶（用最大風速的比例 0~1 標註停點） ===
  const TEAL_CUSTOM_FRAC_STOPS = [
    [0.00, '#ffffff'], // 
    [0.10, '#98ffff'], // 
    [0.20, '#00ceff'], // 
    [0.30, '#006af7'], // 
    [0.40, '#fefe08'], // 
    [0.50, '#ffcb00'], // 
    [0.60, '#ff9c00'], // 
    [0.70, '#fe0005'], // 
    [0.80, '#c90200'], // 
    [0.90, '#9d0000'], // 
    [1.00, '#9a009d']  // 
  ];

  // 依目前最大風速 pMax 轉成絕對值（m/s）
  function tealStopsAbs(max){ return TEAL_CUSTOM_FRAC_STOPS.map(([p,c])=>[p*max, c]); }


  // 起始視角
  const map = new mapboxgl.Map({
    container:'map', style:STYLE_URL,
    center:[121,23.6], zoom:8.5, pitch:60, bearing:-10, antialias:true
  });
  map.setMinZoom(8);
  map.setMaxZoom(13);
  map.on('resize', ()=>{ resizeWindCanvas(); clearWindCanvas(); });
  const $ = id => document.getElementById(id);
  const say = t => { $('status').textContent = t; console.log(t); };

  // 啟用地形
  function enableTerrainIfAny(){
    const st = map.getStyle();
    if (st.terrain && !map.getSource(st.terrain.source)) map.setTerrain(null);
    const dem = Object.entries(st.sources).find(([,s])=>s.type==='raster-dem');
    if (dem) {
      map.setTerrain({ source: dem[0], exaggeration: 4 }); 
      if (!map.getLayer('sky')) map.addLayer({ id:'sky', type:'sky', paint:{ 'sky-type':'atmosphere' }});
    }
  }

  function hexToRgb(hex) {
    const raw = hex.replace('#', '');
    const norm = raw.length === 3 ? raw.split('').map(ch => ch + ch).join('') : raw;
    const int = parseInt(norm, 16);
    return { r: (int >> 16) & 255, g: (int >> 8) & 255, b: int & 255 };
  }

  function colorForSpeed(speed, max, kind, alpha = 1) {
    const stops = paletteStops(kind, max);
    if (!stops.length) return `rgba(255,255,255,${alpha})`;
    if (speed <= stops[0][0]) {
      const c = hexToRgb(stops[0][1]);
      return `rgba(${c.r},${c.g},${c.b},${alpha})`;
    }
    for (let i = 1; i < stops.length; i++) {
      const [v1, c1] = stops[i];
      const [v0, c0] = stops[i - 1];
      if (speed <= v1) {
        const t = v1 === v0 ? 0 : (speed - v0) / (v1 - v0);
        const a = hexToRgb(c0), b = hexToRgb(c1);
        const r = Math.round(lerp(a.r, b.r, t));
        const g = Math.round(lerp(a.g, b.g, t));
        const bb = Math.round(lerp(a.b, b.b, t));
        return `rgba(${r},${g},${bb},${alpha})`;
      }
    }
    const c = hexToRgb(stops[stops.length - 1][1]);
    return `rgba(${c.r},${c.g},${c.b},${alpha})`;
  }

  // 切換可見層
  function currentKey(){
    const s=document.querySelector('input[name="season"]:checked').value;
    const t=document.querySelector('input[name="tod"]:checked').value;
    return `${s}_${t}`;
  }

  function ensureWindCanvas() {
    if (windCanvas && windCanvas.isConnected) return;
    windCanvas = document.createElement('canvas');
    windCanvas.className = 'wind-canvas';
    map.getContainer().appendChild(windCanvas);
    windCtx = windCanvas.getContext('2d');
    resizeWindCanvas();
  }

  function resizeWindCanvas() {
    if (!windCanvas) return;
    const rect = map.getContainer().getBoundingClientRect();
    windDpr = Math.max(1, window.devicePixelRatio || 1);
    windCanvasWidth = Math.max(1, Math.round(rect.width));
    windCanvasHeight = Math.max(1, Math.round(rect.height));
    windCanvas.width = Math.round(windCanvasWidth * windDpr);
    windCanvas.height = Math.round(windCanvasHeight * windDpr);
    windCanvas.style.width = `${windCanvasWidth}px`;
    windCanvas.style.height = `${windCanvasHeight}px`;
    windCtx.setTransform(windDpr, 0, 0, windDpr, 0, 0);
    clearWindCanvas();
  }

  function clearWindCanvas() {
    if (!windCtx) return;
    windCtx.clearRect(0, 0, windCanvasWidth, windCanvasHeight);
  }

  function randomIn(min, max) {
    return min + Math.random() * (max - min);
  }

  function boundsAreaKm2(bounds = map.getBounds()) {
    const north = bounds.getNorth();
    const south = bounds.getSouth();
    const east = bounds.getEast();
    const west = bounds.getWest();
    const meanLatRad = ((north + south) * 0.5) * Math.PI / 180;
    const widthKm = Math.abs(east - west) * 111.32 * Math.max(0.2, Math.cos(meanLatRad));
    const heightKm = Math.abs(north - south) * 111.32;
    return Math.max(1, widthKm * heightKm);
  }

  function updateActualCountLabel(count = windActualTargetCount) {
    const el = document.getElementById('actualCount');
    if (el) el.textContent = `${Math.round(count).toLocaleString()}`;
  }

  function currentWindConfig() {
    return {
      count: +$('pCount').value,
      speedFactor: parseFloat($('pSpeed').value),
      fade: parseFloat($('pFade').value),
      maxSpeed: +$('pMax').value,
      reset: parseFloat($('pReset').value),
      lineScale: parseFloat($('pLineScale').value),
      smoothing: parseFloat($('pSmooth').value),
      ignoreTerrainFlow: !!$('chkIgnoreTerrainFlow')?.checked,
      palette: $('pPalette').value
    };
  }

  function buildStreamPath(seedLng, seedLat, cfg) {
    const path = [];
    let lng = seedLng;
    let lat = seedLat;
    const stepSeconds = 32 + cfg.speedFactor * 62;
    const segments = Math.max(24, Math.round(22 + cfg.speedFactor * 30 + (cfg.fade - 0.8) * 44));
    const directionSmoothing = cfg.ignoreTerrainFlow ? Math.max(cfg.smoothing, 0.96) : cfg.smoothing;
    let prevU = null;
    let prevV = null;
    let anchorU = null;
    let anchorV = null;

    for (let i = 0; i < segments; i++) {
      const sample = sampleWindAt(currentKey(), lng, lat);
      if (!sample) break;
      const pt = map.project([lng, lat]);
      if (pt.x < -120 || pt.y < -120 || pt.x > windCanvasWidth + 120 || pt.y > windCanvasHeight + 120) break;
      path.push({ x: pt.x, y: pt.y, speed: sample.speed, lng, lat });

      const latRad = lat * Math.PI / 180;
      const cosLat = Math.max(0.2, Math.cos(latRad));
      const midLng = lng + (sample.u * stepSeconds * 0.5) / (111320 * cosLat);
      const midLat = lat + (sample.v * stepSeconds * 0.5) / 111320;
      const midSample = sampleWindAt(currentKey(), midLng, midLat);
      if (!midSample) break;

      if (anchorU == null || anchorV == null) {
        anchorU = midSample.u;
        anchorV = midSample.v;
      }
      const baseU = cfg.ignoreTerrainFlow ? lerp(midSample.u, anchorU, 0.96) : midSample.u;
      const baseV = cfg.ignoreTerrainFlow ? lerp(midSample.v, anchorV, 0.96) : midSample.v;
      const smoothU = prevU == null
        ? baseU
        : lerp(baseU, prevU, directionSmoothing);
      const smoothV = prevV == null
        ? baseV
        : lerp(baseV, prevV, directionSmoothing);
      prevU = smoothU;
      prevV = smoothV;

      const midCosLat = Math.max(0.2, Math.cos(midLat * Math.PI / 180));
      lng = lng + (smoothU * stepSeconds) / (111320 * midCosLat);
      lat = lat + (smoothV * stepSeconds) / 111320;
    }

    return path;
  }

  function resetParticle(particle, cfg = currentWindConfig()) {
    const bounds = map.getBounds();
    for (let tries = 0; tries < 60; tries++) {
      const lng = randomIn(bounds.getWest(), bounds.getEast());
      const lat = randomIn(bounds.getSouth(), bounds.getNorth());
      const sample = sampleWindAt(currentKey(), lng, lat);
      if (!sample) continue;
      const path = buildStreamPath(lng, lat, cfg);
      if (path.length < 6) continue;
      particle.path = path;
      particle.progress = Math.random() * Math.min(2, path.length - 1);
      particle.age = 0;
      particle.maxAge = 220 + Math.random() * 260;
      particle.state = 'active';
      particle.fadeAge = 0;
      particle.fadeMaxAge = 26 + Math.random() * 28;
      return particle;
    }
    particle.path = [];
    particle.progress = 0;
    particle.age = 0;
    particle.maxAge = 1;
    particle.state = 'active';
    particle.fadeAge = 0;
    particle.fadeMaxAge = 1;
    return particle;
  }

  function beginFadeOut(particle) {
    particle.state = 'fading';
    particle.fadeAge = 0;
    particle.fadeMaxAge = 26 + Math.random() * 28;
  }

  function syncParticlePool(cfg = currentWindConfig()) {
    if (!windReferenceAreaKm2) windReferenceAreaKm2 = boundsAreaKm2();
    const currentAreaKm2 = boundsAreaKm2();
    const areaRatio = currentAreaKm2 / windReferenceAreaKm2;
    const scaledTarget = Math.round(cfg.count * Math.pow(areaRatio, 0.62));
    const minTarget = Math.max(900, Math.round(cfg.count * 0.42));
    const maxTarget = Math.min(12000, Math.round(cfg.count * 2.2));
    const target = Math.max(minTarget, Math.min(maxTarget, scaledTarget));
    windActualTargetCount = target;
    updateActualCountLabel(target);
    while (windParticles.length < target) windParticles.push(resetParticle({}, cfg));
    if (windParticles.length > target) windParticles.length = target;
  }

  function restartWindField() {
    const cfg = currentWindConfig();
    syncParticlePool(cfg);
    clearWindCanvas();
    windParticles.forEach(p => resetParticle(p, cfg));
  }

  function stepWindCanvas(ts) {
    if (!windCtx) return;
    const dt = windLastFrameTs ? Math.min(0.05, Math.max(0.008, (ts - windLastFrameTs) / 1000)) : 1 / 60;
    windLastFrameTs = ts;
    const cfg = currentWindConfig();
    syncParticlePool(cfg);
    if (map.isMoving()) {
      clearWindCanvas();
    } else {
      const retention = Math.min(0.97, Math.max(0.82, cfg.fade - 0.015));
      windCtx.save();
      windCtx.globalCompositeOperation = 'destination-in';
      windCtx.fillStyle = `rgba(0,0,0,${retention})`;
      windCtx.fillRect(0, 0, windCanvasWidth, windCanvasHeight);
      windCtx.restore();
    }

    const resetChance = 0.00025 + cfg.reset * 0.0009;
    const zoomNow = map.getZoom();
    const zoomDelta = zoomNow - (windReferenceZoom ?? zoomNow);
    const zoomLengthScale = Math.pow(2, -zoomDelta * 0.65);
    const zoomWidthScale = Math.pow(2, zoomDelta * 0.16);
    const targetTrailPixels = (90 + cfg.speedFactor * 110 + (cfg.fade - 0.8) * 260) * zoomLengthScale;
    const advance = dt * (4.8 + cfg.speedFactor * 8.2) * 2.0 * zoomLengthScale;

    const interpolatePoint = (a, b, t) => ({
      x: lerp(a.x, b.x, t),
      y: lerp(a.y, b.y, t),
      speed: lerp(a.speed || 0, b.speed || 0, t),
      lng: lerp(a.lng, b.lng, t),
      lat: lerp(a.lat, b.lat, t)
    });

    const projectTrailPoints = points => {
      const out = [];
      for (const pt of points) {
        if (!Number.isFinite(pt?.lng) || !Number.isFinite(pt?.lat)) continue;
        const proj = map.project([pt.lng, pt.lat]);
        if (!Number.isFinite(proj.x) || !Number.isFinite(proj.y)) continue;
        out.push({ x: proj.x, y: proj.y, speed: pt.speed || 0, lng: pt.lng, lat: pt.lat });
      }
      return out;
    };

    const trimTrailByPixels = (projected, maxPixels) => {
      if (!projected || projected.length < 2) return projected;
      let acc = 0;
      let start = projected.length - 1;
      for (let i = projected.length - 1; i > 0; i--) {
        const a = projected[i - 1];
        const b = projected[i];
        acc += Math.hypot(b.x - a.x, b.y - a.y);
        start = i - 1;
        if (acc >= maxPixels) break;
      }
      return projected.slice(start);
    };

    const drawGradientTrail = (points, lastSpeed, fadeScale = 1) => {
      if (!points || points.length < 2 || lastSpeed <= 0) return;
      const projected = trimTrailByPixels(projectTrailPoints(points), targetTrailPixels);
      if (projected.length < 2) return;
      const n = projected.length - 1;
      for (let i = 0; i < n; i++) {
        const a = projected[i];
        const b = projected[i + 1];
        const t0 = i / Math.max(1, n - 1);
        const t1 = (i + 1) / Math.max(1, n);
        const t = (t0 + t1) * 0.5;
        const alpha = lerp(0.05, 0.98, Math.pow(t, 1.35)) * fadeScale;
        const width = lerp(0.75, 1.35, Math.pow(t, 1.15)) * cfg.lineScale * zoomWidthScale;
        windCtx.beginPath();
        windCtx.moveTo(a.x, a.y);
        windCtx.lineTo(b.x, b.y);
        windCtx.strokeStyle = colorForSpeed(lastSpeed, cfg.maxSpeed, cfg.palette, alpha);
        windCtx.lineWidth = width;
        windCtx.stroke();
      }
    };

    for (const p of windParticles) {
      if (!Array.isArray(p.path) || p.path.length < 2) {
        resetParticle(p, cfg);
        continue;
      }

      if (p.state !== 'fading' && (p.age >= p.maxAge || Math.random() < resetChance)) {
        beginFadeOut(p);
      }

      if (p.state === 'fading') {
        p.fadeAge += dt * 60;
        const fadeT = Math.max(0, 1 - p.fadeAge / p.fadeMaxAge);
        const headIndex = Math.min(p.path.length - 1, Math.max(0, Math.floor(p.progress)));
        const head = p.path[headIndex];
        const lastSpeed = head?.speed || 0;

        if (head && lastSpeed > 0) {
          const fadedPoints = p.path.slice(0, headIndex + 1);
          drawGradientTrail(fadedPoints, lastSpeed, fadeT);

          const headScreen = map.project([head.lng, head.lat]);
          windCtx.beginPath();
          windCtx.arc(headScreen.x, headScreen.y, 0.95 * Math.max(0.75, cfg.lineScale) * zoomWidthScale, 0, Math.PI * 2);
          windCtx.fillStyle = colorForSpeed(lastSpeed, cfg.maxSpeed, cfg.palette, fadeT);
          windCtx.fill();
        }

        if (fadeT <= 0) resetParticle(p, cfg);
        continue;
      }

      p.progress += advance;
      p.age += dt * 60;
      if (p.progress >= p.path.length - 1) {
        beginFadeOut(p);
        continue;
      }

      const headIndex = Math.floor(p.progress);
      const frac = p.progress - headIndex;
      const head = interpolatePoint(p.path[headIndex], p.path[Math.min(headIndex + 1, p.path.length - 1)], frac);
      const lastSpeed = head.speed || p.path[headIndex].speed || 0;
      const activePoints = p.path.slice(0, headIndex + 1);
      activePoints.push(head);
      drawGradientTrail(activePoints, lastSpeed, 1);

      const headScreen = map.project([head.lng, head.lat]);
      windCtx.beginPath();
      windCtx.arc(headScreen.x, headScreen.y, 0.95 * Math.max(0.75, cfg.lineScale) * zoomWidthScale, 0, Math.PI * 2);
      windCtx.fillStyle = colorForSpeed(lastSpeed, cfg.maxSpeed, cfg.palette, 1);
      windCtx.fill();
    }

    windAnimFrame = requestAnimationFrame(stepWindCanvas);
  }

  // 產生一個帶黑邊白心的箭頭，使用 ImageData 明確指定尺寸
  function ensureArrowImage() {
    const NAME = 'wind-arrow';

    // --- 固定整數尺寸，避免非整數 DPR 造成誤差 ---
    const base = 64;                 // 以 64px 為基底畫布
    const dpr  = 2;                  // 用固定 2x（夠銳利又穩定）
    const W = base * dpr, H = base * dpr;

    const cv  = document.createElement('canvas');
    cv.width  = W;                   // 這裡是實際像素尺寸（非 CSS）
    cv.height = H;
    const ctx = cv.getContext('2d');
    ctx.scale(dpr, dpr);             // 把作畫座標縮回 0..64
    ctx.lineCap = 'round';
    ctx.lineJoin = 'round';

    // 畫箭頭（→）: 桿 + 箭頭
    const shaft = () => { ctx.moveTo(10, 32); ctx.lineTo(46, 32); };
    const head  = () => { ctx.moveTo(46, 20); ctx.lineTo(58, 32); ctx.lineTo(46, 44); };

    // 外框(黑)
    ctx.strokeStyle = '#000';
    ctx.lineWidth = 6;
    ctx.beginPath(); shaft(); ctx.stroke();
    ctx.beginPath(); head();  ctx.stroke();

    // 內線(白)
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 3;
    ctx.beginPath(); shaft(); ctx.stroke();
    ctx.beginPath(); head();  ctx.stroke();

    // 轉成 ImageData（長度 = W*H*4）
    const id = ctx.getImageData(0, 0, W, H);

    // 加之前先移除同名影像，避免尺寸不一致
    try { if (map.hasImage(NAME)) map.removeImage(NAME); } catch(_) {}

    // 用 {width,height,data} 明確添加，並設 pixelRatio 與 dpr 一致
    map.addImage(NAME, { width: W, height: H, data: id.data }, { pixelRatio: dpr });
  }




  // 把這 4 行改成你放在網站上的檔名/路徑
  const WINDDIR_FILES = {
    DJF_day:   'wind_DJF_day_native.json',
    DJF_night: 'wind_DJF_night_native.json',
    JJA_day:   'wind_JJA_day_native.json',
    JJA_night: 'wind_JJA_night_native.json'
  };
// 你給我的 native JSON 會包含 U/V 兩筆紀錄（parameterNumber: 2=U, 3=V）
  // DIR_IS_FROM=true 代表資料是「來向」，會自動 +180 變「去向」
  const DIR_IS_FROM = true;
  const ROT_OFFSET  = 90;     // 右轉 90°

  function lerp(a, b, t) {
    return a + (b - a) * t;
  }

  async function loadNativeWindGrid(url) {
    const raw = await fetch(url).then(r => {
      if (!r.ok) throw new Error(`HTTP ${r.status} ${r.statusText}`);
      return r.json();
    });

    const arr = Array.isArray(raw) ? raw : (raw.data || raw);
    const uRec = arr.find(r => r?.header?.parameterNumber === 2);
    const vRec = arr.find(r => r?.header?.parameterNumber === 3);
    if (!uRec || !vRec) throw new Error('找不到 U/V 分量記錄');

    const { nx, ny, lo1, la1, dx, dy } = uRec.header;
    const U = uRec.data, V = vRec.data;
    if (!U || !V || U.length !== nx * ny || V.length !== nx * ny) {
      throw new Error(`U/V 長度與 nx*ny 不符 (nx=${nx}, ny=${ny}, U=${U?.length}, V=${V?.length})`);
    }
    return { nx, ny, lo1, la1, dx, dy, U, V };
  }

  async function loadAllWindNative() {
    const tasks = Object.entries(WINDDIR_FILES).map(async ([key, url]) => {
      if (!url) return;
      if (!WIND_NATIVE[key]) WIND_NATIVE[key] = await loadNativeWindGrid(url);
    });
    await Promise.all(tasks);
  }

  // 讀 native 風場，抽稀每 N 格，輸出 GeoJSON(Point)
  async function loadDirFromNative(url, gridStep = 3) {
    const key = Object.entries(WINDDIR_FILES).find(([, file]) => file === url)?.[0];
    const grid = (key && WIND_NATIVE[key]) ? WIND_NATIVE[key] : await loadNativeWindGrid(url);
    const { nx, ny, lo1, la1, dx, dy, U, V } = grid;

    const lonC = i => lo1 + (i + 0.5) * dx; // 取格心
    const latC = j => la1 - (j + 0.5) * dy; // 緯度向南遞減（重點）

    const feats = [];
    for (let j = 0; j < ny; j += gridStep) {
      for (let i = 0; i < nx; i += gridStep) {
        const idx = j * nx + i;
        const u = U[idx], v = V[idx];
        if (u == null || v == null || isNaN(u) || isNaN(v)) continue;

        // 以正北為 0°、順時針（Mapbox 的 text/icon-rotate 預設）
        let ang = Math.atan2(u, v) * 180 / Math.PI;   // u(東)、v(北)
        if (DIR_IS_FROM) ang = (ang + 180) % 360;     // 來向→去向
        ang = (ang + ROT_OFFSET + 360) % 360;        // ★ 右轉 90°
        const mag = Math.hypot(u, v);

        feats.push({
          type: 'Feature',
          geometry: { type: 'Point', coordinates: [ lonC(i), latC(j) ] },
          properties: { angle: ang, mag, u, v, i, j }
        });
      }
    }
    return { type: 'FeatureCollection', features: feats };
  }

  function sampleWindAt(key, lng, lat) {
    const g = WIND_NATIVE[key];
    if (!g) return null;
    const x = (lng - g.lo1) / g.dx - 0.5;
    const y = (g.la1 - lat) / g.dy - 0.5;
    const i = Math.floor(x);
    const j = Math.floor(y);
    if (i < 0 || j < 0 || i >= g.nx - 1 || j >= g.ny - 1) return null;
    const fx = x - i;
    const fy = y - j;
    const idx = (ii, jj) => jj * g.nx + ii;
    const u00 = g.U[idx(i, j)],     u10 = g.U[idx(i + 1, j)];
    const u01 = g.U[idx(i, j + 1)], u11 = g.U[idx(i + 1, j + 1)];
    const v00 = g.V[idx(i, j)],     v10 = g.V[idx(i + 1, j)];
    const v01 = g.V[idx(i, j + 1)], v11 = g.V[idx(i + 1, j + 1)];
    const u = lerp(lerp(u00, u10, fx), lerp(u01, u11, fx), fy);
    const v = lerp(lerp(v00, v10, fx), lerp(v01, v11, fx), fy);
    const speed = Math.hypot(u, v);
    const dirTo = (Math.atan2(u, v) * 180 / Math.PI + 360) % 360;
    const dirFrom = (dirTo + 180) % 360;
    return { u, v, speed, dirTo, dirFrom };
  }

  // === 平順飛行工具（地形無感） ===
  // 柔和 easing（保留）
  const easeInOutSine = t => 0.5 - 0.5 * Math.cos(Math.PI * t);
  const FLY_DUR = 4000; // 城市或單段飛行的預設時間
// 用法：runWithTerrain([ preset ], [ FLY_DUR ], { lockPitch:true });


  function throttleParticles(enableFull) {
    if (enableFull) restartWindField();

  // 不縮放弧線的單段動畫（保留）
  function easeToAsync(opts, duration = 4500) {
    return new Promise(resolve => {
      if (map.isMoving()) map.stop();
      map.once('moveend', resolve);
      map.easeTo({ duration, easing: easeInOutSine, essential: true, ...opts });
    });
  }

  // 多段串接（保留）
  async function smoothRun(steps, durations=[]) {
    for (let i=0; i<steps.length; i++) {
      await easeToAsync(steps[i], durations[i] ?? 4500);
      await new Promise(r => setTimeout(r, 120));
    }
  }

  // ✅ 保留地形的平順飛行：整段「鎖定 pitch」，最後再把 pitch 補到目標值
  async function runWithTerrain(steps, durations=[], { lockPitch=true } = {}) {
    throttleParticles(false);
    const startPitch = map.getPitch();

    // 先用「固定的 pitch」飛完全程，降低地形視差造成的「爬升/下降」錯覺
    const patched = lockPitch
      ? steps.map(s => ({ ...s, pitch: startPitch }))
      : steps;

    await smoothRun(patched, durations);

    // 如果最後一步有指定 pitch，飛完後再短促補上目標 pitch（不影響地形）
    const last = steps[steps.length - 1] || {};
    if (lockPitch && typeof last.pitch === 'number' && Math.abs(last.pitch - startPitch) > 0.1) {
      await easeToAsync({
        center: last.center ?? map.getCenter(),
        zoom:   last.zoom   ?? map.getZoom(),
        bearing:last.bearing ?? map.getBearing(),
        pitch:  last.pitch

  function msFor(from, to, min=1800, max=4200){
    const a = map.project(from), b = map.project(to);
    const d = Math.hypot(a.x-b.x, a.y-b.y);           // 螢幕座標距離（像素）
    const t = Math.min(1, d / 1200);                  // 0~1 規模化
    return Math.round(min + (max-min) * t*t);         // 慢速起步感更自然
  }

  // 回傳 legend 用的 [速度(m/s), 顏色] 停點
  function paletteStops(kind, max) {
    switch (kind) {
      case 'blue':
        return [[0,'#001e3d'], [3,'#0046a0'], [7,'#00c8ff'], [max,'#ffffff']];
      case 'fire':
        return [[0,'#202020'], [3,'#783c00'], [7,'#dc7800'], [max,'#ffffdc']];
      case 'teal':
        return tealStopsAbs(max);

      default: // white（用亮度做過渡）
        return [[0,'#e8e8e8'], [Math.max(1, max*0.4),'#f5f5f5'], [max,'#ffffff']];
    }
  }

  function drawWindLegend(){
    const canvas = document.getElementById('windScale');
    const ctx = canvas.getContext('2d');
    const max = +document.getElementById('pMax').value;     // 最大風速（與地圖一致）
    const kind = document.getElementById('pPalette').value; // 目前色帶
    document.getElementById('legendPaletteName').textContent =
      document.querySelector('#pPalette option:checked').textContent;


    // 建立水平漸層
    const grad = ctx.createLinearGradient(0,0,canvas.width,0);
    const stops = paletteStops(kind, max);
    stops.forEach(([v,c]) => grad.addColorStop(Math.max(0, Math.min(1, v/max)), c));
    ctx.fillStyle = grad;
    ctx.fillRect(0,0,canvas.width,canvas.height);

    // 刻度（0%、25%、50%、75%、100%）→ 一位小數
    const ticks = [0, .25, .5, .75, 1].map(p => (p * max).toFixed(1));
    document.getElementById('windTicks').innerHTML =
      ticks.map(v => `<span>${v}</span>`).join('');
  }

  async function loadPins() {
    try {
      const res = await fetch(PIN_FILE_URL, { cache: 'no-store' });
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      PIN_DATA.type = 'FeatureCollection';
      PIN_DATA.features = Array.isArray(data?.features) ? data.features : [];
      refreshPins();
      say(`已載入 ${PIN_DATA.features.length} 個圖釘`);
    } catch (err) {
      PIN_DATA.type = 'FeatureCollection';
      PIN_DATA.features = [];
      refreshPins();
      say('pins.json 尚未建立，已使用空白圖釘資料');
    }
  }

  async function addTerrainOverlay() {
    // 讀入四角座標（來源是 [lat, lon]，需轉成 [lng, lat]）
    const b = await fetch('terrain_bounds.json').then(r => r.json());
    const sw = ([lat, lon]) => [lon, lat];
    const coords = [ sw(b.topleft), sw(b.topright), sw(b.bottomright), sw(b.bottomleft) ];

    if (!map.getSource('terrain-img')) {
      map.addSource('terrain-img', {
        type: 'image',
        url: 'terrain_land_only.png',
        coordinates: coords
      });
    }

    // 放在風場之下：若 wind_JJA_day 已存在，就插到它之前
    const beforeId = map.getLayer('wind_JJA_day') ? 'wind_JJA_day' : undefined;
    if (!map.getLayer('terrain-layer')) {
      map.addLayer({
        id: 'terrain-layer',
        type: 'raster',
        source: 'terrain-img',
        layout: { visibility: 'none' }, // 預設不顯示
        paint: { 'raster-opacity': parseFloat($('terrainOpacity').value) }
      }, beforeId);
    }
  }
